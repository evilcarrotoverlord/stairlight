# Stairlight - ESP32-WROOM-32E N4 on a DOMRAEM ESP32 addressable LED controller, WS2815 strip.
substitutions:
  name: stairlight
  # Compile-time LED capacity = how many LEDs are transmitted on every frame (~30 us each, per strip).
  # 512 (~15 ms/frame) allows e.g. 13x39, 21x24, 32x16 and is the most robust against flicker.
  # 3072 = full 32x96 range but ~92 ms per frame. Steps x LEDs above this is clamped (see Status).
  max_leds: "512"

esphome:
  name: ${name}
  friendly_name: Stairlight
  includes:
    - stairlight_core.h
    - stairlight_esphome.h
  on_boot:
    priority: 600
    then:
      - lambda: |-
          stair::engine().init(${max_leds});
      - light.turn_on:
          id: strip_main
          brightness: 100%

esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # Let the RMT TX interrupt keep running while flash is written (settings saves etc.).
      # Without this, a flash write stalls the LED signal mid-frame = corrupted pixels.
      CONFIG_RMT_TX_ISR_CACHE_SAFE: "y"

logger:

packages:
  trigger: !include packages/trigger_gpio.yaml      # swap for packages/trigger_adc.yaml in phase 2

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none     # steadier interrupt timing for the LED signal
  ap:                       # fallback access point, web page at http://192.168.4.1
    ssid: stairlight
    password: !secret ap_password

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 3
  local: true               # serve the UI from the device itself (no CDN) - required for AP mode
  sorting_groups:
    - id: grp_config
      name: "Configuration"
      sorting_weight: -30
    - id: grp_actions
      name: "Actions"
      sorting_weight: -20
    - id: grp_status
      name: "Status"
      sorting_weight: -10
    - id: grp_diag
      name: "Diagnostics"
      sorting_weight: 0

# ---------------------------------------------------------------------------------------------
# Hardware
# ---------------------------------------------------------------------------------------------
switch:
  - platform: gpio
    id: relay_out
    pin:
      number: GPIO12            # strapping pin: must be LOW at reset. Verify the board's relay driver.
    restore_mode: ALWAYS_OFF
    internal: true

light:
  # LED data on GPIO16 (DOM-WLE-AM default output, level-shifted on the board). Frames are written
  # directly from the interval below (no ESPHome effect: effects re-send every frame, which causes flicker).
  - platform: esp32_rmt_led_strip
    id: strip_main
    pin: GPIO16
    num_leds: ${max_leds}
    channel_colors: GRB
    chipset: WS2812
    rmt_symbols: 384          # bigger RMT buffer = more tolerance to Wi-Fi interrupt latency (max 512 with one strip)
    default_transition_length: 0s
    gamma_correct: 1.0
    restore_mode: ALWAYS_OFF
    internal: true
  # Colour picker: drives no hardware, only stores the colour the animations use.
  - platform: rgb
    id: stair_color
    name: "Color"
    web_server:
      sorting_group_id: grp_config
      sorting_weight: 50
    red: dummy_r
    green: dummy_g
    blue: dummy_b
    default_transition_length: 0s
    gamma_correct: 1.0
    restore_mode: RESTORE_DEFAULT_ON
    initial_state:
      red: 100%
      green: 58%
      blue: 16%
      brightness: 100%

  # Read-only-in-spirit indicator: green = relay on, red = relay off.
  - platform: rgb
    id: relay_indicator
    name: "Relay Indicator (green = on, red = off)"
    web_server:
      sorting_group_id: grp_status
      sorting_weight: 20
    red: ind_r
    green: ind_g
    blue: ind_b
    default_transition_length: 0s
    gamma_correct: 1.0
    restore_mode: ALWAYS_ON

output:
  - {platform: template, id: dummy_r, type: float, write_action: [{lambda: "(void) state;"}]}
  - {platform: template, id: dummy_g, type: float, write_action: [{lambda: "(void) state;"}]}
  - {platform: template, id: dummy_b, type: float, write_action: [{lambda: "(void) state;"}]}
  - {platform: template, id: ind_r, type: float, write_action: [{lambda: "(void) state;"}]}
  - {platform: template, id: ind_g, type: float, write_action: [{lambda: "(void) state;"}]}
  - {platform: template, id: ind_b, type: float, write_action: [{lambda: "(void) state;"}]}

# ---------------------------------------------------------------------------------------------
# Configuration entities (all persisted across reboots)
# ---------------------------------------------------------------------------------------------
select:
  - platform: template
    id: anim_mode
    name: "Animation Mode"
    options:
      - "1 - Sequential Step Roll"
      - "2 - Inward Fill"
      - "3 - Falling Block"
      - "4 - Alternating Serpent"
    initial_option: "1 - Sequential Step Roll"
    optimistic: true
    restore_value: true
    web_server:
      sorting_group_id: grp_config
      sorting_weight: 10

number:
  - platform: template
    id: steps_num
    name: "Steps"
    min_value: 1
    max_value: 32
    step: 1
    initial_value: 13
    optimistic: true
    restore_value: true
    mode: box
    web_server:
      sorting_group_id: grp_config
      sorting_weight: 20
  - platform: template
    id: leds_num
    name: "LEDs per Step"
    min_value: 1
    max_value: 96
    step: 1
    initial_value: 21
    optimistic: true
    restore_value: true
    mode: box
    web_server:
      sorting_group_id: grp_config
      sorting_weight: 30
  - platform: template
    id: linger_num
    name: "Linger Time"
    unit_of_measurement: "s"
    min_value: 1
    max_value: 300
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
    mode: box
    web_server:
      sorting_group_id: grp_config
      sorting_weight: 40

button:
  - platform: template
    name: "Trigger Top (top to bottom)"
    web_server: {sorting_group_id: grp_actions, sorting_weight: 10}
    on_press:
      - lambda: |-
          stair::engine().trigger(stair::DIR_DOWN, millis());
  - platform: template
    name: "Trigger Bottom (bottom to top)"
    web_server: {sorting_group_id: grp_actions, sorting_weight: 20}
    on_press:
      - lambda: |-
          stair::engine().trigger(stair::DIR_UP, millis());
  - platform: template
    name: "Test Size"
    web_server: {sorting_group_id: grp_actions, sorting_weight: 30}
    on_press:
      - lambda: |-
          stair::engine().test(millis());
  - platform: template
    name: "Relay (toggle for 5 s)"
    web_server: {sorting_group_id: grp_actions, sorting_weight: 40}
    on_press:
      - lambda: |-
          stair::engine().relay_override(millis());
  # ---- Diagnostics (hardware checks, measure with a multimeter) --------------------------------
  - platform: template
    name: "Diagnose Relay GPIO12 (strip power off 8s, on 8s, off 8s)"
    web_server: {sorting_group_id: grp_diag, sorting_weight: 10}
    on_press:
      - lambda: |-
          stair::engine().start_diag(stair::DIAG_RELAY, millis());
  - platform: template
    name: "Diagnose Data GPIO16 (held HIGH 30s, then reboot)"
    web_server: {sorting_group_id: grp_diag, sorting_weight: 20}
    on_press:
      - lambda: |-
          stair::engine().start_diag(stair::DIAG_DATA, millis());
  - platform: template
    name: "Cancel Diagnostic"
    web_server: {sorting_group_id: grp_diag, sorting_weight: 30}
    on_press:
      - lambda: |-
          stair::engine().cancel_diag(millis());

binary_sensor:
  - platform: template
    name: "Relay On"
    lambda: |-
      return id(relay_out).state;
    web_server: {sorting_group_id: grp_status, sorting_weight: 10}

text_sensor:
  - platform: template
    id: status_text
    name: "Status"
    web_server: {sorting_group_id: grp_status, sorting_weight: 5}

# ---------------------------------------------------------------------------------------------
# Glue: settings -> engine, engine -> relay / status / indicator (every 10 ms)
# ---------------------------------------------------------------------------------------------
interval:
  - interval: 10ms
    then:
      - lambda: |-
          auto &e = stair::engine();
          uint32_t now = millis();

          stair::Settings s;
          s.mode = (stair::Mode) id(anim_mode).active_index().value_or(0);
          if (!std::isnan(id(steps_num).state)) s.steps = (int) id(steps_num).state;
          if (!std::isnan(id(leds_num).state)) s.leds = (int) id(leds_num).state;
          if (!std::isnan(id(linger_num).state)) s.linger_ms = (uint32_t) (id(linger_num).state * 1000.0f);
          auto cv = id(stair_color).remote_values;
          float br = cv.get_brightness();
          s.color.r = (uint8_t) (cv.get_red() * br * 255.0f + 0.5f);
          s.color.g = (uint8_t) (cv.get_green() * br * 255.0f + 0.5f);
          s.color.b = (uint8_t) (cv.get_blue() * br * 255.0f + 0.5f);
          e.apply_settings(s, now);
          e.tick(now);
          e.render(now);
          if (stair::pusher().should_send(e.frame(), e.state(), now)) {
            auto *a = static_cast<esphome::light::AddressableLight *>(id(strip_main).get_output());
            stair::write_frame(*a, e.frame());
          }

          bool want = e.relay_actual();
          if (id(relay_out).state != want) {
            if (want) id(relay_out).turn_on(); else id(relay_out).turn_off();
          }

          static int last_relay = -1;
          if ((int) want != last_relay) {
            last_relay = (int) want;
            auto call = id(relay_indicator).make_call();
            call.set_state(true);
            call.set_rgb(want ? 0.0f : 1.0f, want ? 1.0f : 0.0f, 0.0f);
            call.set_brightness(1.0f);
            call.set_transition_length(0);
            call.perform();
          }

          // Data-pin diagnostic: hold GPIO16 HIGH; when it ends (or is cancelled) reboot to restore the LED driver.
          static bool data_held = false;
          if (e.diag_data_hold()) {
            stair::hold_data_pin_high();
            data_held = true;
          } else if (data_held || e.diag_reboot_needed()) {
            data_held = false;
            App.safe_reboot();
          }

          static std::string last_status;
          std::string st = e.status_at(now);
          if (st != last_status) {
            last_status = st;
            id(status_text).publish_state(st);
          }
